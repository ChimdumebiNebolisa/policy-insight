services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policyinsight
      POSTGRES_USER: policyinsight
      POSTGRES_PASSWORD: policyinsight
    ports:
      - "55432:5432"
    volumes:
      - policyinsight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyinsight -d policyinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  policyinsight-postgres:
