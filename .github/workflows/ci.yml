name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - rebuild/simple-gemini-railway
  pull_request:
    branches:
      - rebuild/simple-gemini-railway

jobs:
  test:
    name: Maven verify (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Check Docker
        run: docker version

      - name: Maven version (wrapper download check)
        run: ./mvnw --version

      - name: Run tests and integration tests
        run: ./mvnw --batch-mode verify -Pintegration-tests

      - name: Upload Maven test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t policy-insight:ci .
