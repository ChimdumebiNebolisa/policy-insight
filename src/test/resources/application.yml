spring:
  datasource:
    url: jdbc:h2:mem:policyinsight;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  token-secret: test-secret-that-is-long-enough-for-hmac
  upload:
    max-bytes: 10485760
  owner-token:
    ttl-minutes: 120
  ai:
    provider: mock
