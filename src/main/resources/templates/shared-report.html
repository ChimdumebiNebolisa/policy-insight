<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared PolicyInsight Report</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell report-shell">
    <header class="report-header">
        <p class="eyebrow">Shared PolicyInsight report</p>
        <h1>Risk report</h1>
        <p th:text="${reportView.report().documentOverview()}">Document overview</p>
    </header>

    <section class="report-grid">
        <article class="panel">
            <h2>Summary</h2>
            <ul>
                <li th:each="claim : ${reportView.report().summaryBullets()}">
                    <span th:text="${claim.text()}">Claim</span>
                    <span class="citation" th:each="id : ${claim.chunkIds()}" th:text="${'#' + id}">#chunk</span>
                    <span class="unsupported" th:if="${claim.unsupported()}">Unsupported citation</span>
                </li>
            </ul>
        </article>
        <article class="panel">
            <h2>Obligations</h2>
            <ul>
                <li th:each="claim : ${reportView.report().obligations()}" th:text="${claim.text()}">Obligation</li>
            </ul>
        </article>
        <article class="panel">
            <h2>Restrictions</h2>
            <ul>
                <li th:each="claim : ${reportView.report().restrictions()}" th:text="${claim.text()}">Restriction</li>
            </ul>
        </article>
        <article class="panel">
            <h2>Termination Triggers</h2>
            <ul>
                <li th:each="claim : ${reportView.report().terminationTriggers()}" th:text="${claim.text()}">Trigger</li>
            </ul>
        </article>
        <article class="panel">
            <h2>Risk Taxonomy</h2>
            <ul>
                <li th:each="claim : ${reportView.report().riskTaxonomy()}" th:text="${claim.text()}">Risk</li>
            </ul>
        </article>
        <article class="panel">
            <h2>Source Chunks</h2>
            <ol>
                <li th:each="chunk : ${reportView.chunks()}">
                    <strong th:text="${chunk.id}">chunk</strong>
                    <p th:text="${chunk.textContent}">Source text</p>
                </li>
            </ol>
        </article>
    </section>
</main>
</body>
</html>
