<!doctype html>
<html lang="en">
<head th:replace="~{fragments/layout :: head('PolicyInsight error')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="page-shell narrow-shell">
    <section class="error-card">
        <p class="eyebrow" th:text="${statusCode}">Error</p>
        <h1 th:text="${errorTitle}">Something went wrong</h1>
        <p th:text="${safeErrorMessage}">The request could not be completed.</p>
        <div class="hero-actions">
            <a class="button button-primary" href="/#upload">Back to upload</a>
            <a class="button button-secondary" href="/sample">Open sample report</a>
        </div>
    </section>
</main>
</body>
</html>
