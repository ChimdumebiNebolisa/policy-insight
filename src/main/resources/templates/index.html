<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PolicyInsight</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell">
    <section class="panel">
        <p class="eyebrow">PolicyInsight</p>
        <h1>Analyze a policy PDF</h1>
        <form hx-post="/upload" hx-target="#upload-result" hx-swap="innerHTML" enctype="multipart/form-data" method="post">
            <label for="file">PDF document</label>
            <input id="file" name="file" type="file" accept="application/pdf" required>
            <button type="submit">Upload and analyze</button>
        </form>
        <div id="upload-result"></div>
    </section>
</main>
</body>
</html>
