<article th:fragment="qaAnswer" class="answer-card">
    <p th:text="${answer.answer()}">Answer</p>
    <div class="claim-meta">
        <a class="citation-chip" th:each="id : ${answer.chunkIds()}"
           th:href="${'#source-' + id}" th:title="${id}"
           th:text="${sourceLabels != null && sourceLabels.containsKey(id) ? sourceLabels.get(id) : 'Source'}">Source</a>
        <span class="unsupported-chip" th:if="${answer.unsupported()}">Unsupported citation</span>
    </div>
</article>
