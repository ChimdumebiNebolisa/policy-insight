<div class="upload-status-box">
    <p><strong>Status:</strong> <span th:text="${status}"></span></p>
    <p th:if="${message}" th:text="${message}"></p>
    <p th:if="${errorMessage}" class="status-error" th:text="'Error: ' + ${errorMessage}"></p>
    <div id="poll"
         th:if="${status != 'SUCCESS' and status != 'FAILED'}"
         th:attr="hx-get='/api/documents/' + ${jobId} + '/status'"
         hx-trigger="load, every 2s"
         hx-target="#status"
         hx-swap="innerHTML"
         class="status-processing">
        <p>Processing… <span class="spinner">Checking status…</span></p>
    </div>
</div>
