<div th:fragment="status" class="status-card" th:classappend="${status.status().name() == 'FAILED'} ? ' status-card-error' : ''">
    <div class="status-header">
        <span class="status-icon" aria-hidden="true"></span>
        <div>
            <p class="section-kicker" th:text="${status.status().name() == 'FAILED'} ? 'Review stopped' : (${completed} ? 'Report ready' : 'Processing document')">Processing document</p>
            <h3 th:text="${completed} ? 'Your cited report is ready' : (${status.status().name() == 'FAILED'} ? 'We could not finish this report' : 'Building your report')">Building your report</h3>
        </div>
    </div>
    <div class="progress-list" th:if="${!completed && status.status().name() != 'FAILED'}">
        <span>Extracting text</span>
        <span>Building cited report</span>
        <span>Validating evidence</span>
    </div>
    <p class="muted" th:if="${status.safeErrorMessage()}" th:text="${status.safeErrorMessage()}">Processing failed.</p>
    <form class="fallback-form" th:if="${status.fallbackAvailable()}"
          th:hx-post="@{/fallback/{id}(id=${status.jobId()})}" hx-target="closest .status-card" hx-swap="outerHTML"
          method="post">
        <div class="fallback-callout">
            <p><strong>Generate demo-style report from extracted text</strong></p>
            <p class="muted">Demo fallback. Not live AI analysis.</p>
        </div>
        <button class="button button-secondary" type="submit">Generate demo-style report</button>
    </form>
    <a class="button button-primary" th:if="${completed}" th:href="@{/report/{id}(id=${status.reportId()})}">View report</a>
    <div th:unless="${completed || status.status().name() == 'FAILED'}"
         th:hx-get="@{/status/{id}(id=${status.jobId()})}" hx-trigger="every 2s" hx-swap="outerHTML">
        <p class="muted">This usually takes a few seconds. You can keep this page open.</p>
    </div>
</div>
