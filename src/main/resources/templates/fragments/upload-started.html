<div class="upload-status-box">
    <p><strong>Document uploaded successfully!</strong></p>
    <p>Job ID: <code th:text="${jobId}"></code></p>
    <div id="poll"
         th:attr="hx-get='/api/documents/' + ${jobId} + '/status'"
         hx-trigger="load, every 2s"
         hx-target="#status"
         hx-swap="innerHTML"
         class="status-processing">
        <p>Processing document… <span class="spinner">Checking status…</span></p>
    </div>
</div>
