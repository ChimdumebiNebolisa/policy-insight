<div th:fragment="uploadStarted" class="status-card"
     th:hx-get="@{/status/{id}(id=${jobId})}" hx-trigger="load delay:500ms, every 2s"
     hx-target="#job-status" hx-swap="innerHTML">
    <div class="status-header">
        <span class="status-icon" aria-hidden="true"></span>
        <div>
            <p class="section-kicker" th:text="${acceptKicker}">Upload accepted</p>
            <h3>
                <span th:text="${chunkCount}">0</span>
                <span>source section(s) extracted</span>
            </h3>
        </div>
    </div>
    <div class="progress-list">
        <span class="step-done">Document received</span>
        <span class="step-done">Text extracted</span>
        <span>Building AI report</span>
        <span>Validating citations</span>
        <span>Completed</span>
    </div>
</div>
