spring:
  application:
    name: policy-insight
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policyinsight}
    username: ${SPRING_DATASOURCE_USERNAME:policyinsight}
    password: ${SPRING_DATASOURCE_PASSWORD:policyinsight}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_BYTES:10485760}
      max-request-size: ${APP_UPLOAD_MAX_BYTES:10485760}

app:
  ai:
    provider: ${APP_AI_PROVIDER:mock}
  upload:
    max-bytes: ${APP_UPLOAD_MAX_BYTES:10485760}
  paste:
    max-chars: ${APP_PASTE_MAX_CHARS:500000}
  owner-token:
    ttl-minutes: ${APP_OWNER_TOKEN_TTL_MINUTES:120}
  share:
    ttl-days: ${APP_SHARE_TTL_DAYS:7}
  token-secret: ${APP_TOKEN_SECRET:dev-only-change-me}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
  cleanup:
    enabled: ${APP_CLEANUP_ENABLED:true}
    retention-completed-days: ${APP_RETENTION_COMPLETED_DAYS:30}
    retention-failed-days: ${APP_RETENTION_FAILED_DAYS:7}
    retention-expired-share-days: ${APP_RETENTION_EXPIRED_SHARE_DAYS:0}
    job-stale-minutes: ${APP_JOB_STALE_MINUTES:30}
    fixed-delay-ms: ${APP_CLEANUP_FIXED_DELAY_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
